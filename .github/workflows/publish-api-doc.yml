name: Publish API documentation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Cache local Luarocks repository
        uses: actions/cache@v6
        with:
          path: ~/.luarocks
          key: ${{ runner.os }}-luarocks-${{ hashFiles('**/*.rockspec') }}
          restore-keys: |
            ${{ runner.os }}-luarocks-

      - name: Install Lua and LuaRocks
        id: install-lua
        run: |
          sudo apt-get install lua5.4 liblua5.4-dev luarocks
          sudo update-alternatives --install /usr/bin/lua lua-interpreter /usr/bin/lua5.4 54
          sudo update-alternatives --install /usr/bin/luac lua-compiler /usr/bin/luac5.4 54
          sudo update-alternatives --set lua-interpreter /usr/bin/lua5.4
          sudo update-alternatives --set lua-compiler /usr/bin/luac5.4
          luarocks config --scope user lua_version 5.4
          luarocks config --scope user lua_dir /usr
          luarocks config --local deploy_bin_dir >> "$GITHUB_PATH"
          luarocks --lua-version=5.4 --local install --only-deps *.rockspec

      - name: Print versions
        run: |
          lua -v
          luarocks --version
          luarocks path

      - name: Install Tools
        run: |
          luarocks install --local ldoc

      - name: Generate API documentation
        run: |
          ./tools/build-docs.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./target/ldoc

  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
